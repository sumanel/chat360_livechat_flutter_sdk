name: chat360_livechat_sdk
description: "Chat360LiveChatSDK — embeds the Chat360 business live-chat console (app.chat360.io) as an already-authenticated, mobile-shell view."
version: 0.0.5
repository: https://github.com/sumanel/chat360_livechat_flutter_sdk

publish_to: none

environment:
  sdk: '>=3.4.3 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.9.0

  webview_flutter_android: '>=3.16.9 <5.0.0'
  file_picker: ^8.0.6
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  url_launcher: ^6.1.5
  http: ^1.1.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
